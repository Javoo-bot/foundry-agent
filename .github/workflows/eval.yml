name: evaluate

# The agent is evaluated on every push and once a night, and the results are
# committed back so the published page always reflects a run that actually
# happened rather than a number someone typed.
#
# The nightly schedule is the part that matters. A suite that only runs when
# you remember to run it measures your attention, not the agent.

on:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md"]
  schedule:
    - cron: "17 3 * * *"   # not on the hour; that is when everyone else runs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQL guard is a security control. If it stops holding, nothing
      # below this line is worth running.
      - name: Test the read-only guard
        run: python -m pytest agent/test_guard.py -q

      - name: Run the golden set
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ secrets.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          AZURE_MODEL_TOKEN: ${{ secrets.AZURE_MODEL_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python evals/run.py

      # Publish the results even when the gate failed. A run that dropped
      # below the threshold is exactly the run worth being able to read.
      - name: Commit the results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          git diff --staged --quiet || git commit -m "Evaluation run ${{ github.run_number }}"
          git push

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4
